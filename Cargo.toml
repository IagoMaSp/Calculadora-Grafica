[package]
name = "app_grafica"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
num-complex = "0.4.6"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Compilar dependencias optimizadas también en debug: la app se nota fluida al desarrollar.
[profile.dev.package."*"]
opt-level = 2
